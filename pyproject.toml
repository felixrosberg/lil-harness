[project]
name = "lil-harness"
version = "0.1.0"
description = "A small harness for learning tool use with open source LLMs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "openai>=3.0",
    "pydantic>=2.7",
    "pyyaml>=6",
]

[project.scripts]
lil-eval = "lil_harness.evals.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lil_harness"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "hosted: calls a real hosted model; needs LIL_BASE_URL, LIL_MODEL and LIL_API_KEY",
    "vllm: calls a running local vLLM server (scripts/serve_vllm.sh)",
    "ollama: calls a running local Ollama server with qwen3:4b pulled",
]
addopts = "-m 'not hosted and not vllm and not ollama'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
